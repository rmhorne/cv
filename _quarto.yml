project:
  type: default
  output-dir: _output
  render:
    - index.qmd

filters:
  - cv-entries.lua
  - cv-updated.lua

format:
  html:
    pagetitle: "Ryan Horne – Curriculum Vitae"
    output-file: index.html
    theme: cosmo
    css: cv.css
    toc: true
    toc-title: "Sections"
    toc-depth: 2
    embed-resources: true
    format-links: false
    other-links:
      - text: Download PDF
        href: cv.pdf
        icon: file-earmark-pdf
  typst:
    output-file: cv.pdf
    papersize: us-letter
    margin:
      x: 0.9in
      y: 0.8in
    fontsize: 10.5pt
