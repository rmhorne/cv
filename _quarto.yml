project:
  type: default
  output-dir: _output
  render:
    - index.qmd
    - cv-pomona.qmd

filters:
  - cv-entries.lua
  - cv-updated.lua

format:
  html:
    pagetitle: "Ryan Horne – Curriculum Vitae"
    theme: cosmo
    css: cv.css
    toc: true
    toc-title: "Sections"
    toc-depth: 2
    embed-resources: true
    format-links: false
  typst:
    papersize: us-letter
    margin:
      x: 0.9in
      y: 0.7in
    fontsize: 10.5pt
